spring.application.name=attack-shield
# Reproducible builds stamp every jar entry 1980-02-01, so browsers would cache the dashboard forever.
# The files are tiny and served locally: always fetch fresh.
spring.web.resources.cache.cachecontrol.no-store=true
# ...and never answer "304 not modified" based on that frozen date, or a reload keeps the stale page.
spring.web.resources.cache.use-last-modified=false
